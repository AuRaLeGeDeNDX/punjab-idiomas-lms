<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Builder Debug</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2>Content Builder Debug Test</h2>
        
        <!-- Test Add Content Button -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">
                    <i class="fas fa-puzzle-piece"></i> Content Builder
                </h5>
                <div class="btn-group">
                    <button type="button" class="btn btn-primary btn-sm" data-add-content data-section="main_content">
                        <i class="fas fa-plus"></i> Add Content Block
                    </button>
                </div>
            </div>
            <div class="card-body">
                <p>Click the "Add Content Block" button above to test if the modal opens.</p>
                <div id="debug-output"></div>
            </div>
        </div>
    </div>

    <!-- Content Type Modal -->
    <div class="modal fade" id="contentTypeModal" tabindex="-1" aria-labelledby="contentTypeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="contentTypeModalLabel">Choose Content Type</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row" id="content-type-grid">
                        <!-- Content types will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        console.log('=== DEBUG CONTENT BUILDER ===');
        
        // Mock data for testing
        const contentTypes = {
            'text': {
                'label': 'Text Block',
                'icon': 'fas fa-paragraph',
                'description': 'Rich text content'
            },
            'image': {
                'label': 'Image Block',
                'icon': 'fas fa-image',
                'description': 'Upload and display images'
            }
        };

        // Debug function
        function debugLog(message) {
            console.log(message);
            const output = document.getElementById('debug-output');
            output.innerHTML += '<div class="alert alert-info">' + message + '</div>';
        }

        // Test event delegation
        document.addEventListener('click', function(e) {
            const addBtn = e.target.closest('[data-add-content]');
            if (addBtn) {
                e.preventDefault();
                debugLog('✓ Add Content Block button clicked: ' + addBtn.textContent.trim());
                debugLog('✓ Section: ' + addBtn.dataset.section);
                
                // Store the section for later use
                window.currentContentSection = addBtn.dataset.section || 'main_content';
                
                // Open the content type selection modal
                openContentTypeModal();
                return;
            }
        });

        function openContentTypeModal() {
            debugLog('Opening content type modal...');
            
            const modal = document.getElementById('contentTypeModal');
            if (!modal) {
                debugLog('❌ Content type modal not found!');
                return;
            }
            
            // Populate content types
            populateContentTypes();
            
            // Open modal using Bootstrap
            if (window.bootstrap && window.bootstrap.Modal) {
                const bsModal = new bootstrap.Modal(modal);
                bsModal.show();
                debugLog('✓ Modal opened successfully');
            } else {
                debugLog('❌ Bootstrap Modal not available');
            }
        }

        function populateContentTypes() {
            const grid = document.getElementById('content-type-grid');
            if (!grid) {
                debugLog('❌ Content type grid not found');
                return;
            }
            
            debugLog('Populating content types...');
            
            // Generate content type cards
            let html = '';
            Object.entries(contentTypes).forEach(([type, config]) => {
                html += `
                    <div class="col-md-6 mb-3">
                        <div class="content-type-card border rounded p-3 text-center" data-type="${type}" style="cursor: pointer;">
                            <div class="content-type-icon mb-2">
                                <i class="${config.icon} fa-2x text-primary"></i>
                            </div>
                            <h6>${config.label}</h6>
                            <p class="text-muted small mb-0">${config.description}</p>
                        </div>
                    </div>
                `;
            });
            
            grid.innerHTML = html;
            debugLog('✓ Content type cards populated');
            
            // Add click handlers to content type cards
            grid.addEventListener('click', function(e) {
                const card = e.target.closest('.content-type-card');
                if (card) {
                    const type = card.dataset.type;
                    debugLog('✓ Content type selected: ' + type);
                    
                    // Close the modal
                    const modal = document.getElementById('contentTypeModal');
                    const bsModal = bootstrap.Modal.getInstance(modal);
                    if (bsModal) {
                        bsModal.hide();
                    }
                    
                    debugLog('✓ Modal closed, would open edit form for: ' + type);
                }
            });
        }

        // Check Bootstrap availability on load
        document.addEventListener('DOMContentLoaded', function() {
            debugLog('✓ DOM loaded');
            debugLog('✓ Bootstrap available: ' + (typeof window.bootstrap !== 'undefined'));
            debugLog('✓ Bootstrap Modal available: ' + (typeof window.bootstrap?.Modal !== 'undefined'));
            
            const buttons = document.querySelectorAll('[data-add-content]');
            debugLog('✓ Found ' + buttons.length + ' Add Content buttons');
        });
    </script>
</body>
</html>

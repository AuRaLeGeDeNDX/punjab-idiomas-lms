<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Click Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Button Click Test</h1>
        <p>This tests if the button click handler works correctly.</p>
        
        <button type="button" class="btn btn-primary" data-add-content data-section="main_content">
            <i class="fas fa-plus"></i> Add Content Block
        </button>
        
        <div id="log" class="mt-3 p-3 bg-light border rounded">
            <h5>Console Log:</h5>
            <pre id="log-content"></pre>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const logElement = document.getElementById('log-content');
        
        function log(message) {
            console.log(message);
            logElement.textContent += message + '\n';
        }
        
        log('=== BUTTON CLICK TEST ===');
        log('Script loaded at: ' + new Date().toISOString());
        log('Document ready state: ' + document.readyState);
        
        // STEP 1: GLOBAL EVENT DELEGATION FOR ADD CONTENT BUTTONS
        log('Setting up click event listener...');
        document.addEventListener('click', function(e) {
            try {
                const addBtn = e.target.closest('[data-add-content]');
                if (addBtn) {
                    e.preventDefault();
                    log('✓ Add Content Block button clicked: ' + addBtn.textContent.trim());
                    log('✓ Section: ' + addBtn.dataset.section);
                    log('✓ Button element: ' + addBtn);
                    log('✓ Event target: ' + e.target);
                    
                    alert('Button clicked! Section: ' + addBtn.dataset.section);
                    return;
                }
                
                // Debug: Log all clicks to see what's happening
                log('Click detected on: ' + e.target + ', Closest add-content: ' + e.target.closest('[data-add-content]'));
            } catch (error) {
                log('Error in click handler: ' + error);
                alert('An error occurred. Please check the browser console and refresh the page.');
            }
        });
        log('✓ Click event listener attached');
        
        // Test on DOM ready
        document.addEventListener('DOMContentLoaded', function() {
            log('✓ DOM loaded');
            
            const testButton = document.querySelector('[data-add-content]');
            if (testButton) {
                log('✓ Found test button: ' + testButton);
                log('✓ Button has data-add-content attribute: ' + testButton.hasAttribute('data-add-content'));
                log('✓ Button section: ' + testButton.dataset.section);
            } else {
                log('⚠ No buttons with data-add-content found!');
            }
            
            log('=== TEST READY ===');
        });
    </script>
</body>
</html>

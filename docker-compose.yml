services:
  # Application Service
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: punjab-lms-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - app-network

  # Nginx Service
  webserver:
    image: nginx:alpine
    container_name: punjab-lms-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - app

  # Redis Service
  redis:
    image: redis:alpine
    container_name: punjab-lms-redis
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
